[package]
name = "recorder"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
rmp-serde = "1.3"
toml = "0.7"
dirs = "5.0"
named_pipe = "0.3"
tokio = { version = "1.49", features = ["full"] }
anyhow = "1.0.100"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_ProcessStatus", "Win32_Graphics_Gdi", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Foundation", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi", "Win32_System_WinRT", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics", "Win32_System_WinRT_Graphics_Capture"] }
once_cell = "1.21.3"
shaco = "0.6.0"
async-trait = "0.1.89"
chrono = { version = "0.4.43", features = ["serde"] }
regex = "1.12.2"