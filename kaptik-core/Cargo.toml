[package]
name = "kaptik-core"
version = "0.3.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
rmp-serde = "1.3"
toml = "0.7"
dirs = "5.0"
named_pipe = "0.3"
tokio = { version = "1.49", features = ["full"] }
anyhow = "1.0.100"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_ProcessStatus", "Win32_Graphics_Gdi", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Foundation", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi", "Win32_System_WinRT", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics", "Win32_System_WinRT_Graphics_Capture", "Win32_Graphics_Direct3D_Fxc", "Win32_System_Memory", "Win32_System_Diagnostics", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_Security", "Win32_System_SystemServices", "Win32_Media", "Win32_System_Com", "Win32_Media_Audio", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices", "Win32_Devices_FunctionDiscovery", "Win32_Media_Multimedia", "Win32_Media_KernelStreaming", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Console"] }
once_cell = "1.21.3"
shaco = { git = "https://github.com/linusgenz/Shaco.git", branch = "main" }
async-trait = "0.1.89"
chrono = { version = "0.4.43", features = ["serde"] }
regex = "1.12.2"
serde_plain = "1.0.2"
bytemuck = "1.25.0"
serde_repr = "0.1.20"
lazy_static = "1.5.0"
parking_lot = "0.12.5"
uuid = { version = "1.7", features = ["v4", "serde"] }
tray-icon = "0.21.3"
tao = "0.34.5"
image = "0.25.9"
rmpv = "1.3.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
serde_json = "1.0.149"

[[bin]]
name = "kaptik-core"
path = "src/main.rs"
windows-subsystem = "windows"